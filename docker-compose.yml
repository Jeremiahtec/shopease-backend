services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopease"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopease
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-please-change-this-to-something-long-1234567890}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopease.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

volumes:
  pgdata:
