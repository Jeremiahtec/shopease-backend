spring.application.name=shopease
spring.profiles.default=dev
server.port=${PORT:8080}

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopease}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---- JPA: Flyway owns the schema, Hibernate only validates it ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---- App settings ----
app.jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-key-at-least-32-chars}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:60}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}

# Leave PAYSTACK_SECRET_KEY empty to use the built-in MOCK payment gateway (dev only)
app.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.paystack.base-url=https://api.paystack.co
app.paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:5173/payment/callback}

# Default admin account (created on startup if it does not exist)
app.admin.email=${ADMIN_EMAIL:admin@shopease.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.full-name=ShopEase Admin

# ---- Server hardening / operations ----
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
# trust X-Forwarded-* from the reverse proxy (real client IP for rate limiting, correct https links)
server.forward-headers-strategy=framework
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=200

# health endpoints for Docker / load balancers (only "health" is exposed)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- Security / behaviour ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.rate-limit.max-requests=${RATE_LIMIT_MAX:20}
app.rate-limit.window-seconds=60
app.orders.pending-expiry-minutes=${PENDING_ORDER_EXPIRY_MINUTES:120}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Transactional email through Resend. Leave the key empty to only log emails.
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:ShopEase <onboarding@resend.dev>}

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
